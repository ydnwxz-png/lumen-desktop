<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data:; font-src 'self'">
<style>
@font-face { font-family: 'Inter'; font-weight: 400; src: url('../assets/fonts/Inter-Regular.woff') format('woff'); }
@font-face { font-family: 'Inter'; font-weight: 600; src: url('../assets/fonts/Inter-SemiBold.woff') format('woff'); }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1.4 Inter, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; user-select: none; }
#stack { position: absolute; left: 0; right: 0; padding: 4px 6px; display: flex; flex-direction: column; gap: 8px; }
body.pos-bottom #stack { bottom: 0; flex-direction: column-reverse; }
body.pos-top #stack { top: 0; }
.t { --a1: #c6f432; --a2: #5ef0c8; position: relative; display: flex; gap: 12px; align-items: center; padding: 13px 14px 13px 13px; border-radius: 18px; cursor: pointer; overflow: hidden;
  background: #17171f; color: #ededf3; border: 1px solid rgba(255,255,255,.09); 
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05); animation: in .55s cubic-bezier(.34,1.56,.64,1); transition: transform .2s; }
.t.light { background: #ffffff; color: #15151f; border-color: rgba(20,20,50,.08); }
.t:hover { transform: scale(1.015); }
.t::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 3px; background: linear-gradient(var(--a1), var(--a2)); }
.t::after { content: ''; position: absolute; width: 140px; height: 140px; right: -50px; top: -70px; border-radius: 50%; background: linear-gradient(135deg, var(--a1), var(--a2)); filter: blur(40px); opacity: .28; pointer-events: none; }
.t.out { animation: out .35s cubic-bezier(.2,.8,.2,1) forwards; }
.av { width: 42px; height: 42px; border-radius: 50%; flex: none; position: relative; overflow: hidden; display: grid; place-items: center; color: #0b0b0d; font-weight: 600; font-size: 16px; background: linear-gradient(135deg, var(--a1), var(--a2)); }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.order .av { background: linear-gradient(135deg, #34d399, #059669); font-size: 20px; }
.tx { flex: 1; min-width: 0; }
.ti { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bd { opacity: .72; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 1px; }
.app { position: absolute; top: 9px; right: 12px; font-size: 10.5px; opacity: .45; font-weight: 600; }
.bar { position: absolute; left: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, var(--a1), var(--a2)); animation: bar 7s linear forwards; opacity: .7; }
.t:hover .bar { animation-play-state: paused; }
@keyframes in { from { opacity: 0; transform: translateX(60px) scale(.9); } }
@keyframes out { to { opacity: 0; transform: translateX(80px); } }
@keyframes bar { from { width: 100%; } to { width: 0; } }
</style>
</head>
<body class="pos-bottom">
<div id="stack"></div>
<script src="js/toast.js"></script>
</body>
</html>
